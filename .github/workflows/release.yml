name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'

jobs:
  release:
    uses: joutio/joutio-reusable-workflows/.github/workflows/frontend-release.yml@main
    with:
      github-username: ${{ vars.JOUTIO_GITHUB_USERNAME }}
      # Image : ghcr.io/joutio/joutio-web-console
      service-name: joutio-web-console
      # API admin servie sur la MÊME origine (Ingress : /api/console → joutio-console).
      vite-api-url: https://console.joutio.com
      # Surface admin média du BFF (cross-origin, CORS SDK) : /api/admin/media/**.
      vite-bff-url: https://api.joutio.com
      vite-oidc-authority: https://identity.joutio.com
      vite-oidc-client-id: console
      vite-oidc-redirect-uri: https://console.joutio.com/callback
    secrets:
      GITHUB_PASSWORD: ${{ secrets.JOUTIO_GITHUB_TOKEN }}
